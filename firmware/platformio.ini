; Craudiômetro — firmware ESP32
; Boards suportados: DevKit WROOM-32 (display GMT020-02 + encoder KY-040
; externos) e Waveshare ESP32-C6-LCD-1.47-H (display embutido, navegação
; pelo botão BOOT onboard). Cada board tem seus próprios drivers de
; display/encoder (DisplayDriver_*.cpp, EncoderDriver_*.cpp); build_src_filter
; garante que cada ambiente compile só os arquivos do seu board.

[platformio]
; `pio run`/`pio run -t upload` sem -e continuam visando só este board —
; fluxo de quem já usa o projeto não muda.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; CH340 nesta placa nao sustenta 921600 (erros de verificacao do flash).
upload_speed = 460800
; Sem OTA na v1: partição de app unica de 3 MB (NimBLE + sprites ocupam bastante).
board_build.partitions = huge_app.csv
build_src_filter =
    +<*>
    -<drivers/DisplayDriver_C6Lcd147.cpp>
    -<drivers/EncoderDriver_C6Lcd147.cpp>

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; O GMT020-02 e um painel IPS: a maioria dos lotes exige inversao de cor.
    ; Se o teste de cores da Etapa 2 aparecer em negativo, troque para 0.
    -D CRAUDIO_DISPLAY_INVERT=1

lib_deps =
    lvgl/lvgl@^9.2.2
    lovyan03/LovyanGFX@^1.2.0
    h2zero/NimBLE-Arduino@^2.2.1
    bblanchon/ArduinoJson@^7.2.1

; Waveshare ESP32-C6-LCD-1.47-H: display ST7789 172x320 embutido, sem
; fiacao externa. Navegacao pelo botao BOOT (GPIO9) — ver EncoderDriver_C6Lcd147.cpp.
; O platform oficial espressif32 nao suporta Arduino no ESP32-C6; usa-se o
; fork pioarduino (Arduino Core 3.x / IDF 5.x).
[env:esp32-c6-lcd-147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_src_filter =
    +<*>
    -<drivers/DisplayDriver_Esp32Dev.cpp>
    -<drivers/EncoderDriver_Esp32Dev.cpp>

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; ST7789 desta placa: se o teste de cores aparecer em negativo, troque para 0.
    -D CRAUDIO_DISPLAY_INVERT=1
    ; USB-Serial-JTAG nativo do C6 (sem CH340): exigido para a Serial
    ; (protocolo SNAP de tools/screenshot.py, comandos seriais) funcionar.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lvgl/lvgl@^9.2.2
    lovyan03/LovyanGFX@^1.2.0
    h2zero/NimBLE-Arduino@^2.2.1
    bblanchon/ArduinoJson@^7.2.1
